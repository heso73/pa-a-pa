name: Garder Supabase éveillé

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Requête API (cms-certification)
        run: |
          set -u
          code=$(curl -sS -m 30 -o /dev/null -w "%{http_code}" "https://vtbaqvjxfgseykjcinpu.supabase.co/rest/v1/" -H "apikey: sb_publishable_cZc3a7kaK3M7ZcHRsoTI8w_NQz4Xy0z")
          echo "cms-certification -> HTTP $code"
          case "$code" in 2*|401|403) exit 0 ;; *) exit 1 ;; esac
